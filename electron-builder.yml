appId: com.invis.chess
productName: Chess
directories:
  buildResources: build
  output: release
files:
  - out/**
  - '!**/*.map'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target: dmg
  category: public.app-category.board-games
linux:
  target: AppImage
  category: Game
